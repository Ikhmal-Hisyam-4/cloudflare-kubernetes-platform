name: Deploy

# development -> staging   (https://kubex-staging.<account>.workers.dev)
# main        -> production (https://gpu.kubex.my)
# main only changes through a pull request from development.
on:
  push:
    branches: [development, main]
  workflow_dispatch:

# One deploy per branch at a time; queue instead of cancelling a live one.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: ci
    runs-on: ubuntu-latest
    # Shows up under the repo's Deployments; production can be given required reviewers in repo settings.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: true
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Pick target
        working-directory: .
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "TARGET=production" >> "$GITHUB_ENV"
            echo "WRANGLER_ENV=" >> "$GITHUB_ENV"
            echo "DB_NAME=kubex-db" >> "$GITHUB_ENV"
            echo "SITE_URL=https://gpu.kubex.my" >> "$GITHUB_ENV"
          else
            echo "TARGET=staging" >> "$GITHUB_ENV"
            echo "WRANGLER_ENV=--env staging" >> "$GITHUB_ENV"
            echo "DB_NAME=kubex-staging-db" >> "$GITHUB_ENV"
            echo "SITE_URL=https://kubex-staging.ikhmalhisyam4.workers.dev" >> "$GITHUB_ENV"
          fi

      # Ship the exact build that CI tested.
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - run: npm ci

      # Idempotent: only applies migrations that have not run yet.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$DB_NAME" $WRANGLER_ENV --remote

      - name: Deploy Worker
        run: npx wrangler deploy $WRANGLER_ENV

      - name: Verify deployment
        run: |
          for i in $(seq 1 12); do
            if curl -sf "$SITE_URL/api/health" && curl -sf "$SITE_URL/api/plans" | grep -q RTX && curl -sf "$SITE_URL/" | grep -qi "<html"; then
              echo; echo "$TARGET is healthy"; exit 0
            fi
            echo "waiting for $SITE_URL ... ($i/12)"; sleep 5
          done
          echo "$TARGET failed its health check"; exit 1

      # Staging has its own database, so the full end-to-end test can create users and servers there.
      - name: Smoke test (staging)
        if: env.TARGET == 'staging'
        run: BASE="$SITE_URL/api" SKIP_CRON=1 npm run smoke

      # Puts the previous Worker version back. Database migrations are not undone, so keep them backward compatible.
      - name: Roll back (production)
        if: failure() && env.TARGET == 'production'
        run: |
          npx wrangler rollback --yes --message "auto-rollback of $GITHUB_SHA after failed health check"
