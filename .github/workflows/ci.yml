name: CI

# Runs on pull requests, and is reused by deploy.yml so that nothing is deployed unless it passed here.
on:
  pull_request:
    branches: [development, main]
  workflow_call:

# A new push to the same PR / branch cancels the previous CI run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  WRANGLER_SEND_METRICS: 'false'

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `npm run build` is `tsc -b && vite build`, so this typechecks too.
      # /api = same-origin API, because the Worker serves the app and the API together.
      - run: VITE_API_URL=/api npm run build
      # Build once: the worker job tests it and deploy.yml ships this exact build.
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  worker:
    name: Worker (typecheck, bundle, integration test)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: npm ci
      - run: npm run typecheck

      # Bundles the Worker and validates wrangler.jsonc for both environments, without deploying.
      - name: Bundle (production)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle-prod"
      - name: Bundle (staging)
        run: npx wrangler deploy --dry-run --env staging --outdir "$RUNNER_TEMP/bundle-staging"

      # Real integration test: the Worker on a local D1, exercised over HTTP (auth, deploy, billing cron...).
      - name: Migrate local database
        run: |
          cp .dev.vars.example .dev.vars
          npm run db:migrate:local
      - name: Start Worker
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/api/health && exit 0
            sleep 1
          done
          echo "Worker did not start:"; cat dev.log; exit 1
      - name: Smoke test
        run: npm run smoke
      - name: Worker log
        if: failure()
        run: cat dev.log
