version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: development
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /worker
    target-branch: development
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule: { interval: weekly }
